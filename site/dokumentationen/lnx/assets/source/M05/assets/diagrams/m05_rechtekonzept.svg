<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360">
<style>
  .bg{fill:#0f172a}.box{fill:#1e293b;stroke:#38bdf8;stroke-width:2;rx:16}.muted{fill:#94a3b8;font:14px Arial}.title{fill:#f8fafc;font:bold 18px Arial}.text{fill:#e2e8f0;font:15px Arial}.arrow{stroke:#38bdf8;stroke-width:3;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#38bdf8"/></marker></defs>
<rect class="bg" width="980" height="360"/>
