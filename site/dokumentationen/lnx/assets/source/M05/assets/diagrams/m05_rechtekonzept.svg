<rect x="40" y="205" width="170" height="80" class="box"/><text x="65" y="238" class="title">m05bob</text><text x="65" y="263" class="muted">Testbenutzer</text>
<rect x="300" y="142" width="180" height="80" class="box"/><text x="335" y="175" class="title">m05team</text><text x="325" y="200" class="muted">gemeinsame Gruppe</text>
<rect x="590" y="120" width="310" height="125" class="box"/><text x="625" y="154" class="title">/srv/m05-projekt</text><text x="625" y="183" class="text">root:m05team</text><text x="625" y="207" class="text">Modus 2770 / setgid</text><text x="625" y="231" class="muted">Zugriff nur root + m05team</text>
