<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<style>
.bg{fill:#0f172a}.box{fill:#111827;stroke:#38bdf8;stroke-width:2;rx:18}.box2{fill:#132238;stroke:#7dd3fc;stroke-width:2;rx:18}.txt{font-family:Arial, sans-serif;fill:#f8fafc}.muted{fill:#cbd5e1}.accent{fill:#38bdf8}.line{stroke:#38bdf8;stroke-width:3;marker-end:url(#arrow)}.dash{stroke:#7dd3fc;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}.small{font-size:18px}.title{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker></defs>
