<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<style>.bg{fill:#0f172a}.node{fill:#111827;stroke:#38bdf8;stroke-width:2;rx:16}.txt{font-family:Arial,sans-serif;fill:#f8fafc}.muted{fill:#cbd5e1}.title{font-size:26px;font-weight:700}.small{font-size:17px}.line{stroke:#38bdf8;stroke-width:3;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker></defs>
<rect width="1200" height="330" class="bg"/>
<text x="50" y="50" class="txt title">Nachweiskette M01</text>
<g transform="translate(50,95)"><rect width="180" height="120" class="node"/><text x="24" y="42" class="txt small">1. VM anlegen</text><text x="24" y="75" class="muted small">Hyper-V + ISO</text></g>
<path d="M240 155 L315 155" class="line"/>
<g transform="translate(325,95)"><rect width="180" height="120" class="node"/><text x="22" y="42" class="txt small">2. Installieren</text><text x="22" y="75" class="muted small">Debian / Rocky</text></g>
<path d="M515 155 L590 155" class="line"/>
<g transform="translate(600,95)"><rect width="180" height="120" class="node"/><text x="22" y="42" class="txt small">3. Baseline</text><text x="22" y="75" class="muted small">Hostname, IP, User</text></g>
<path d="M790 155 L865 155" class="line"/>
<g transform="translate(875,95)"><rect width="180" height="120" class="node"/><text x="22" y="42" class="txt small">4. SSH prüfen</text><text x="22" y="75" class="muted small">systemctl + Port 22</text></g>
<text x="50" y="270" class="muted small">Checkpoint erst nach echtem VM-Zustand: Debian13 und Rocky9 jeweils separat nach abgeschlossener Basis- und SSH-Konfiguration.</text>
</svg>