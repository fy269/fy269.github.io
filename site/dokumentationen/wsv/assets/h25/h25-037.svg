<rect x="80" y="120" width="300" height="230" class="card"/>
<text x="115" y="165" class="title">Server1</text>
<text x="115" y="205" class="txt">Content Server</text>
<text x="115" y="235" class="small">Freigabe: BCDaten</text>
<text x="115" y="260" class="small">Hashveröffentlichung per GPO</text>
<text x="115" y="285" class="small">QoS-Test: 1 MB/s</text>
