<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>
.bg{fill:#0f172a}.card{fill:#111827;stroke:#38bdf8;stroke-width:2;rx:12}.card2{fill:#172033;stroke:#94a3b8;stroke-width:1.5;rx:10}.title{font:700 24px Arial;fill:#f8fafc}.txt{font:15px Arial;fill:#e5e7eb}.small{font:12px Arial;fill:#cbd5e1}.accent{fill:#38bdf8}.line{stroke:#38bdf8;stroke-width:3}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}.muted{fill:#94a3b8}</style>
<rect class="bg" width="1200" height="650"/>
