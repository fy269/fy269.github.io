<text x="855" y="285" class="small">Validierung via PerfMon</text>
<line x1="380" y1="235" x2="450" y2="235" class="line"/>
<line x1="750" y1="235" x2="820" y2="235" class="line"/>
<text x="120" y="440" class="txt">Nachweisgrenze:</text>
<text x="120" y="472" class="small">Die Konfiguration und Kontrollpunkte sind dokumentiert. Ein belastbarer WAN-/Performancegewinn wird nicht als eindeutig gemessen behauptet.</text>
