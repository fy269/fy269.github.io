<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420"><rect width="1120" height="420" fill="#0b1220"/><text x="40" y="55" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="28" font-weight="700">Deduplizierungs-Pipeline auf Server2</text><g font-family="Segoe UI,Arial"><rect x="60" y="130" width="200" height="110" rx="16" fill="#1e293b" stroke="#38bdf8"/><text x="85" y="165" fill="#f8fafc" font-size="19" font-weight="700">1. Datenvolume</text><text x="85" y="195" fill="#cbd5e1" font-size="15">VHDX 127 GB</text><text x="85" y="220" fill="#cbd5e1" font-size="15">Volume E:, NTFS</text><rect x="330" y="130" width="210" height="110" rx="16" fill="#1e293b" stroke="#38bdf8"/><text x="355" y="165" fill="#f8fafc" font-size="19" font-weight="700">2. Feature</text><text x="355" y="195" fill="#cbd5e1" font-size="15">Datendeduplizierung</text><text x="355" y="220" fill="#cbd5e1" font-size="15">Allg. Dateiserver</text><rect x="610" y="130" width="210" height="110" rx="16" fill="#1e293b" stroke="#38bdf8"/><text x="635" y="165" fill="#f8fafc" font-size="19" font-weight="700">3. Testdaten</text><text x="635" y="195" fill="#cbd5e1" font-size="15">10 × BMP</text><text x="635" y="220" fill="#cbd5e1" font-size="15">je ca. 45,78 MB</text><rect x="890" y="130" width="190" height="110" rx="16" fill="#1e293b" stroke="#22c55e"/><text x="915" y="165" fill="#f8fafc" font-size="19" font-weight="700">4. Ergebnis</text><text x="915" y="195" fill="#cbd5e1" font-size="15">10 optimiert</text><text x="915" y="220" fill="#cbd5e1" font-size="15">99 % Dateiersparnis</text><path d="M260 185 H330" stroke="#94a3b8" stroke-width="4"/><path d="M540 185 H610" stroke="#94a3b8" stroke-width="4"/><path d="M820 185 H890" stroke="#94a3b8" stroke-width="4"/><rect x="260" y="300" width="600" height="58" rx="14" fill="#111827" stroke="#334155"/><text x="285" y="335" fill="#cbd5e1" font-size="16">Start-DedupJob -Volume "E:" -Type Optimization -Memory 50 -Cores 75</text></g></svg>